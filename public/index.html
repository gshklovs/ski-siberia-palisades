<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171614">
<title>Siberia Express — Palisades Tahoe</title>
<meta name="description" content="Ski Siberia and the Palisades cliff band at Palisades Tahoe. Real USGS 3DEP terrain, real OpenStreetMap trails, in your browser.">
<meta property="og:title" content="Siberia Express — Palisades Tahoe">
<meta property="og:description" content="Ski Siberia and the Palisades at Palisades Tahoe. Real terrain, real rock, in your browser.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/te.css">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/speedo.css">
<!-- The tab icon is the 🎿 emoji, drawn by the OS font inside an inline SVG
     data URI: no file to request, no bytes on the wire, nothing to 404. The
     <text> is centred with dominant-baseline + text-anchor and sized to fill
     the 32-unit viewBox, because a bare font-size:32 emoji sits on its
     alphabetic baseline and hangs out of the bottom of the box. The dark plate
     behind it is the same #171614 as <meta name="theme-color">, so the icon
     reads on a light tab strip as well as a dark one. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171614'/%3E%3Ctext x='16' y='17' font-size='24' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%8E%BF%3C/text%3E%3C/svg%3E">
</head>
<!-- `intro-up` is in the STATIC markup on purpose. main.js boots the desktop
     game paused (that is what makes the first click a real user gesture, which
     is what pointer lock needs), and being paused is what makes the legacy
     pause panel visible. Setting the class from JS would leave one or two
     frames where that panel paints through the intro card. Setting it here
     means it never renders at all. intro.js clears it when you drop in. -->
<body class="play intro-up">

<div id="play-boot" class="pboot">
  <div class="pboot__card">
    <div class="pboot__hd"><span class="led led--on led--blink"></span><span class="lbl lbl--ink">siberia express</span></div>
    <div class="pboot__bd"><div class="pboot__bar"><i></i></div><div id="play-boot-msg" class="pboot__msg">loading the mountain…</div></div>
  </div>
</div>

<!-- Classic (non-module) bootstrap ON PURPOSE: it must inject <base> and an
     <script type="importmap"> BEFORE the first module load is triggered, so the
     vendored three.js resolves and is shared with the player code.

     GENERATED by poi-lab tools/export-red-dog — do not hand-edit. -->
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var bootMsg = document.getElementById('play-boot-msg');
  var say = function (m) { if (bootMsg) bootMsg.textContent = m; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

  // Everything is addressed off the directory this page was served from, so the
  // site works at the domain root AND from any subdirectory.
  //
  // THIS IS ALSO WHAT MAKES /kt22 WORK, and it needed no change to do it.
  // vercel.json rewrites any non-asset path to this file, so a shared waypoint
  // link arrives as location.pathname === '/kt22' — and `new URL('.')` resolves
  // to the DIRECTORY, dropping the last segment, so ROOT is still '/'. (A
  // subdirectory deploy is always fetched with a trailing slash — '/ski/' — and
  // keeps ROOT '/ski/'; `"trailingSlash": false` in vercel.json is what stops a
  // stray '/kt22/' from ever reaching here and being read as a directory.)
  //
  // The slug itself is not parsed here. js/play/spawn.js reads
  // location.pathname's first segment and resolves it against the waypoints the
  // world declares — one boot-time seam, shared with the lab's ?spawn=<id>.
  var ROOT = new URL('.', location.href).href;

  function fail(reason, detail) {
    if (detail === reason) detail = null;
    window.__playError = reason + (detail ? ' — ' + detail : '');
    document.body.innerHTML =
      '<div class="pfail">' +
        '<section class="panel pfail__panel">' +
          '<div class="panel__hd"><span class="lbl lbl--accent">could not start</span></div>' +
          '<div class="panel__bd">' +
            '<div class="pfail__reason">' + esc(reason) + '</div>' +
            (detail ? '<pre class="pfail__detail">' + esc(detail) + '</pre>' : '') +
            '<p class="pfail__hint">This needs a browser with WebGL 2. Try a desktop browser, or reload.</p>' +
          '</div>' +
        '</section>' +
      '</div>';
    document.body.classList.add('play--failed');
  }
  window.__playFail = fail;

  function inject(tag, attrs, text) {
    var el = document.createElement(tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (text != null) el.textContent = text;
    document.head.appendChild(el);
    return el;
  }

  var sceneBase = ROOT + 'scene/';
  // <base> first: the scene's modules resolve their siblings document-relative.
  inject('base', { href: sceneBase });

  var imports = { 'three': ROOT + 'vendor/three.module.min.js' };
  inject('script', { type: 'importmap' }, JSON.stringify({ imports: imports }));

  // What the bench used to fetch from /api/run/<poi>/<run>, inlined.
  window.__PLAY = {
    poi: 'siberia-palisades', run: 'siberia-bowl', info: {}, mode: 'world',
    entryUrl: sceneBase + 'world.mjs',
    sceneBase: sceneBase, sceneHtml: '', imports: imports,
    test: qs.has('test'), qs: qs, say: say,

    // ------------------------------------------------------ specs/0003 flags
    // THIS BLOCK IS THE ENTIRE DIFFERENCE between the lab and the shareable
    // build. There is no fork and there are no text patches doing this any
    // more: bench/public/js/play/flags.js reads these four values, the player
    // reads flags.js, and the strip is reviewable here, in one screen.
    //
    // The defaults in flags.js are the LAB's, so everything below is a
    // deliberate switch-off. Anything a future re-bake adds to the lab arrives
    // in this build turned ON until somebody names it here — which is the right
    // way round for a debug instrument to fail.

    // THE GUIDED RUN IS THIS BUILD'S DEFAULT. main.js reads one flag and only
    // one: `?guide=` on the URL if present, otherwise `__PLAY.guide === true`.
    // The bench flagship leaves it false; here it is the product. This line is
    // also what decides whether guide.js is fetched at all (main.js DYNAMICALLY
    // imports it) and whether intro.js and idle.js are wired up.
    //
    // `?guide=0` still turns it off, which is the escape hatch for anyone who
    // wants the bare mountain (and for a build gate that wants to prove the
    // guide is an addition rather than a rewrite).
    guide: true,
    // FOUND, NOT ADVERTISED. Every gear the lab has is registered and racked,
    // the BIKES INCLUDED (Greg, 2026-08-31: "sneak the bikes back into the
    // secret inventory") — but hold-E still offers exactly boots and skis, and
    // no bike string reaches the legend, the pause panel or the boot cards. The
    // only way to a bike is the undocumented I locker, which is the whole point
    // of it. 'full' would put every gear on the hold-E dropdown, which is the
    // advertising D34/D44 exist to prevent; 'skis' would remove the bike
    // outright. This is the tier in between, and it is why there is one.
    gearSet: 'locker',
    // No top-left readout, no fps chip, no B reference viewer (its /api/poi
    // fetch does not exist on a static host), no bench row in the pause panel,
    // no T fast-travel card, no [play] console dump, and the ESC panel is the
    // five documented rows and nothing else.
    debugHud: false,
    // The wordmark on the skis' topsheet, the toboggan deck, the snowmobile
    // cowl, the boots card, the HUD chip, the pause header and the tab title.
    // D9: no internal identity string reaches a screenshot.
    brand: 'SIBERIA',
    // (`label` is bench chrome — the name the LAB lists a world under. A public
    // build has no fleet to be listed in, so it is deliberately absent.)

    // D16.2 — surface-aware containment. Standing on real collision ground
    // never trips it at any coordinate; it fires on the absence of recoverable
    // ground. x0..y1 are a hard backstop at CORE ± 8 km, unreachable in play.
    fence: {"x0":-8640,"x1":8850,"y0":-8470,"y1":8540,"graceMs":2000,"voidMarginM":60,"rule":"surface-aware"},
    root: ROOT,
  };

  say('loading player…');
  // ONE import. main.js owns the overlay wiring now (specs/0003 §B): speedo and
  // clean always, touch on a coarse pointer, intro and idle behind `guide`,
  // each individually caught, all of them awaited before `__playerReady`. The
  // chain that used to live here was a second wiring the bench had no copy of,
  // and two wirings is exactly the drift 0003 exists to stop.
  import(ROOT + 'js/play/main.js')
    .catch(function (e) {
      console.error(e);
      // never leave the chrome suppressed by a module that failed to load
      document.body.classList.remove('intro-up');
      if (!window.__playFailed) fail('the game failed to start', String(e && e.message || e));
    });
})();
</script>
</body>
</html>
